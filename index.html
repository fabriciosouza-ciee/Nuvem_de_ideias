<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuvem de Ideias - Enviar Resposta</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    h2 { margin-top: 0; color: #333; text-align: center; }
    label { font-weight: bold; display: block; margin-top: 15px; color: #555; }
    input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
    button { width: 100%; margin-top: 25px; padding: 12px; background-color: #4CAF50; color: white; border: none; border-radius: 6px; font-size: 18px; cursor: pointer; transition: 0.3s; }
    button:hover { background-color: #45a049; }
    .status { text-align: center; margin-top: 15px; font-weight: bold; color: #2e7d32; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Nuvem de Ideias</h2>
    <form id="formIdeia">
      <label for="turma">Selecione sua Turma:</label>
      <select id="turma" required>
        <option value="">-- Escolha a Turma --</option>
        <option value="Turma A">Turma A</option>
        <option value="Turma B">Turma B</option>
        <option value="Turma C">Turma C</option>
      </select>

      <label for="nome">Seu Nome (opcional):</label>
      <input type="text" id="nome" placeholder="Anônimo">

      <label for="resposta">Sua Palavra ou Ideia:</label>
      <input type="text" id="resposta" placeholder="Ex: Inovação" required maxlength="30">

      <button type="submit">Enviar Ideia</button>
    </form>
    <div id="status" class="status"></div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Subtitua com as credenciais do seu projeto Firebase
    const firebaseConfig = {
  apiKey: "AIzaSyBPyd0QyTdfmXjWek1wy2rxSYw7xHiT_to",
  authDomain: "ciee-tubarao.firebaseapp.com",
  databaseURL: "https://ciee-tubarao-default-rtdb.firebaseio.com",
  projectId: "ciee-tubarao",
  storageBucket: "ciee-tubarao.firebasestorage.app",
  messagingSenderId: "1031931207865",
  appId: "1:1031931207865:web:8e40f01b03f82d8394fb68",
  measurementId: "G-J8BR6R1P1N"
};


    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.getElementById('formIdeia').addEventListener('submit', (e) => {
      e.preventDefault();

      const turma = document.getElementById('turma').value;
      const nome = document.getElementById('nome').value.trim() || 'Anônimo';
      const resposta = document.getElementById('resposta').value.trim().toLowerCase();

      if (!resposta) return;

      push(ref(db, 'respostas'), {
        turma: turma,
        nome: nome,
        palavra: resposta,
        timestamp: Date.now()
      }).then(() => {
        document.getElementById('status').innerText = "Enviado com sucesso!";
        document.getElementById('resposta').value = '';
        setTimeout(() => { document.getElementById('status').innerText = ''; }, 3000);
      }).catch((err) => {
        alert("Erro ao enviar: " + err.message);
      });
    });
  </script>
</body>
</html>
