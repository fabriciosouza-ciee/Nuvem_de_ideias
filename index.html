<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuvem de Ideias - CIEE Play</title>
    
    <!-- Google Fonts Pixel Art -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase JS SDK (v10 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --pixel-cyan: #38b6ff;
            --pixel-yellow: #facc15;
            --pixel-green: #22c55e;
            --pixel-green-dark: #15803d;
            --pixel-blue-dark: #0f172a;
            --pixel-blue-mid: #1e3a8a;
            --pixel-pink: #ec4899;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            background: linear-gradient(135deg, #070d1e 0%, #0f172a 40%, #1e3a8a 80%, #1d4ed8 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        /* Overlay de Padrão de Pixels */
        .pixel-grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 8px 8px;
            pointer-events: none;
            z-index: 1;
        }

        /* Scanlines CRT simuladas */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 2;
            opacity: 0.6;
        }

        /* Fontes específicas */
        .font-pixel-title {
            font-family: 'Press Start 2P', monospace;
        }

        .font-pixel-body {
            font-family: 'VT323', monospace;
        }

        /* Bordas Pixeladas Retro */
        .pixel-box {
            border: 4px solid #000000;
            box-shadow: 
                -4px 0 0 0 #000000,
                4px 0 0 0 #000000,
                0 -4px 0 0 #000000,
                0 4px 0 0 #000000,
                8px 8px 0 0 rgba(0, 0, 0, 0.5),
                inset 0 0 15px rgba(56, 182, 255, 0.15);
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(4px);
        }

        .pixel-box-glow {
            border: 4px solid var(--pixel-cyan);
            box-shadow: 
                0 0 15px rgba(56, 182, 255, 0.5),
                inset 0 0 10px rgba(56, 182, 255, 0.3),
                -4px 0 0 0 #000,
                4px 0 0 0 #000,
                0 -4px 0 0 #000,
                0 4px 0 0 #000;
        }

        /* Badge Estilo Badge de Fase */
        .badge-pixel {
            box-shadow: 3px 3px 0 0 #000000;
        }

        /* Inputs e Selects com VT323 */
        select.pixel-input, input.pixel-input {
            font-family: 'VT323', monospace;
            font-size: 1.6rem;
            letter-spacing: 1px;
            border: 3px solid #3b82f6;
            outline: none;
            background-color: #020617;
            color: #f8fafc;
            box-shadow: inset 3px 3px 0 #000000;
            transition: all 0.2s ease;
        }

        select.pixel-input:focus, input.pixel-input:focus {
            border-color: var(--pixel-cyan);
            box-shadow: inset 3px 3px 0 #000000, 0 0 12px rgba(56, 182, 255, 0.8);
        }

        /* Botão Arcade 3D Verde */
        .btn-arcade-green {
            background-color: var(--pixel-green);
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            border: 4px solid #000000;
            box-shadow: 
                0 6px 0 0 var(--pixel-green-dark),
                0 10px 0 0 #000000,
                0 0 20px rgba(34, 197, 94, 0.4);
            text-shadow: 2px 2px 0 #000;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            position: relative;
        }

        .btn-arcade-green:hover:not(:disabled) {
            background-color: #4ade80;
            transform: translateY(-2px);
            box-shadow: 
                0 8px 0 0 var(--pixel-green-dark),
                0 12px 0 0 #000000,
                0 0 25px rgba(34, 197, 94, 0.6);
        }

        .btn-arcade-green:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: 
                0 0 0 0 var(--pixel-green-dark),
                0 4px 0 0 #000000;
        }

        .btn-arcade-green:disabled {
            background-color: #4b5563;
            box-shadow: 0 4px 0 0 #1f2937, 0 6px 0 0 #000;
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Animação de Brilho no Título */
        @keyframes pixelGlow {
            0%, 100% { text-shadow: 3px 3px 0 #000, 0 0 10px var(--pixel-cyan); }
            50% { text-shadow: 3px 3px 0 #000, 0 0 20px var(--pixel-cyan), 0 0 30px #60a5fa; }
        }

        .title-glow {
            animation: pixelGlow 3s infinite alternate;
        }

        /* Animações de Nuvens em Pixel Art */
        .pixel-cloud {
            position: absolute;
            opacity: 0.25;
            pointer-events: none;
            animation: floatCloud linear infinite;
        }

        @keyframes floatCloud {
            from { transform: translateX(-150px); }
            to { transform: translateX(calc(100vw + 150px)); }
        }

        /* Modal Retro */
        .modal-pixel {
            background: rgba(15, 23, 42, 0.98);
            border: 4px solid var(--pixel-yellow);
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.4), inset 0 0 15px rgba(250, 204, 21, 0.2);
        }
    </style>
</head>

    <script>
        // Configuração Exata do Firebase Realtime Database
        const firebaseConfig = {
          apiKey: "AIzaSyBPyd0QyTdfmXjWek1wy2rxSYw7xHiT_to",
          authDomain: "ciee-tubarao.firebaseapp.com",
          databaseURL: "https://ciee-tubarao-default-rtdb.firebaseio.com",
          projectId: "ciee-tubarao",
          storageBucket: "ciee-tubarao.firebasestorage.app",
          messagingSenderId: "1031931207865",
          appId: "1:1031931207865:web:8e40f01b03f82d8394fb68",
          measurementId: "G-J8BR6R1P1N"
        };

        // Inicializar Firebase
        let firebaseApp, database;
        try {
            firebaseApp = firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            console.log("Firebase Database Inicializado com Sucesso!");
        } catch (err) {
            console.error("Erro ao inicializar Firebase:", err);
        }

        // Mapeamento Exato de Cidades e Turmas
        const turmasPorCidade = {
            "Braço do Norte": [
                "Terça matutino",
                "Terça vespertino"
            ],
            "Imbituba": [
                "Segunda vespertino",
                "Quarta matutino",
                "Quarta vespertino",
                "Quinta matutino",
                "Quinta vespertino",
                "Sexta matutino",
                "Sexta vespertino"
            ],
            "Tubarão": [
                "Segunda vesp (Sofia)",
                "Segunda vesp (Fabrício)",
                "Terça matutino",
                "Terça vesp (Fabrício)",
                "Terça vesp (João Gabriel)",
                "Quarta matutino",
                "Quarta vespertino",
                "Quinta matutino",
                "Quinta vespertino",
                "Sexta matutino",
                "Sexta vespertino"
            ]
        };

        // Atualização Dinâmica do Campo de Turmas
        function atualizarTurmas() {
            const cidadeSelect = document.getElementById('cidade');
            const turmaSelect = document.getElementById('turma');
            const cidadeSelecionada = cidadeSelect.value;

            // Limpa as opções anteriores
            turmaSelect.innerHTML = '';

            if (cidadeSelecionada && turmasPorCidade[cidadeSelecionada]) {
                const turmas = turmasPorCidade[cidadeSelecionada];
                
                // Opção padrão
                const defaultOption = document.createElement('option');
                defaultOption.value = '';
                defaultOption.disabled = true;
                defaultOption.selected = true;
                defaultOption.textContent = '-- SELECIONE A TURMA --';
                turmaSelect.appendChild(defaultOption);

                // Adicionar turmas correspondentes
                turmas.forEach(turma => {
                    const option = document.createElement('option');
                    option.value = turma;
                    option.textContent = turma;
                    turmaSelect.appendChild(option);
                });

                // Habilita o select
                turmaSelect.disabled = false;
                turmaSelect.classList.remove('opacity-50');
                play8BitSound('select');
            } else {
                turmaSelect.disabled = true;
                turmaSelect.classList.add('opacity-50');
                const defaultOption = document.createElement('option');
                defaultOption.value = '';
                defaultOption.disabled = true;
                defaultOption.selected = true;
                defaultOption.textContent = '-- PRIMEIRA SELEICIONE A CIDADE --';
                turmaSelect.appendChild(defaultOption);
            }
        }

        // Contador de caracteres para a palavra
        function atualizarContador(input) {
            const counter = document.getElementById('charCounter');
            const count = input.value.length;
            counter.textContent = `${count} / 30`;
            
            if (count >= 30) {
                counter.classList.add('text-red-400');
            } else {
                counter.classList.remove('text-red-400');
            }
        }

        // Função para enviar formulário ao Firebase Realtime Database
        async function enviarIdeia(event) {
            event.preventDefault();
            
            const cidade = document.getElementById('cidade').value;
            const turma = document.getElementById('turma').value;
            const palavraInput = document.getElementById('palavra');
            const palavra = palavraInput.value.trim();
            const btnSubmit = document.getElementById('btnSubmit');

            if (!cidade || !turma || !palavra) {
                exibirStatus("Preencha todos os campos antes de enviar!", "erro");
                return;
            }

            // Desabilita o botão para evitar envio duplo
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<span>ENVIANDO...</span> <i class="fa-solid fa-spinner animate-spin ml-2"></i>`;

            try {
                // Objeto com anonimato total (sem nome)
                const novaResposta = {
                    cidade: cidade,
                    turma: turma,
                    palavra: palavra,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                };

                // Envia para a coleção 'respostas' no Firebase Realtime Database
                await database.ref('respostas').push(novaResposta);

                // Efeito sonoro retrô de vitória
                play8BitSound('fanfare');

                // Exibe Modal de Sucesso
                document.getElementById('successModal').classList.remove('hidden');

                // Reset do formulário
                document.getElementById('ideiaForm').reset();
                atualizarContador(document.getElementById('palavra'));
                atualizarTurmas();

            } catch (error) {
                console.error("Erro ao salvar no Firebase:", error);
                exibirStatus("ERRO AO CONECTAR COM O SERVIDOR. TENTE NOVAMENTE!", "erro");
                play8BitSound('error');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<span>ENVIAR IDEIA</span> <span class="text-xl">▶</span>`;
            }
        }

        // Exibir mensagem de status local
        function exibirStatus(texto, tipo) {
            const msgEl = document.getElementById('statusMsg');
            msgEl.textContent = texto;
            msgEl.classList.remove('hidden', 'bg-red-950', 'text-red-300', 'border-red-500', 'bg-green-950', 'text-green-300', 'border-green-500');
            
            if (tipo === 'erro') {
                msgEl.classList.add('bg-red-950', 'text-red-300', 'border-2', 'border-red-500');
            } else {
                msgEl.classList.add('bg-green-950', 'text-green-300', 'border-2', 'border-green-500');
            }

            setTimeout(() => {
                msgEl.classList.add('hidden');
            }, 4000);
        }

        // Fechar Modal
        function fecharModal() {
            document.getElementById('successModal').classList.add('hidden');
        }

        // Gerador de Nuvens Retrô Dinâmicas no Fundo
        function gerarNuvensBackground() {
            const container = document.getElementById('cloud-container');
            const numNuvens = 5;

            for (let i = 0; i < numNuvens; i++) {
                const cloud = document.createElement('div');
                cloud.className = 'pixel-cloud';
                
                // SVG de Nuvem Pixel Art
                cloud.innerHTML = `
                    <svg width="120" height="60" viewBox="0 0 120 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="20" y="20" width="80" height="30" fill="#38b6ff"/>
                        <rect x="30" y="10" width="60" height="40" fill="#38b6ff"/>
                        <rect x="40" y="0" width="40" height="50" fill="#38b6ff"/>
                        <rect x="10" y="30" width="100" height="15" fill="#38b6ff"/>
                    </svg>
                `;

                const topPos = Math.random() * 80; // 0% a 80% da altura
                const duration = 25 + Math.random() * 35; // 25s a 60s
                const delay = Math.random() * -30; // offset inicial

                cloud.style.top = `${topPos}%`;
                cloud.style.animationDuration = `${duration}s`;
                cloud.style.animationDelay = `${delay}s`;

                container.appendChild(cloud);
            }
        }

        // Sintetizador de Som 8-Bit usando Web Audio API
        function play8BitSound(type) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                if (type === 'select') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.05);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.05);
                } else if (type === 'fanfare') {
                    const notes = [440, 554.37, 659.25, 880];
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'square';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.1, ctx.currentTime + idx * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (idx + 1) * 0.08 + 0.1);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(ctx.currentTime + idx * 0.08);
                        osc.stop(ctx.currentTime + (idx + 1) * 0.08 + 0.1);
                    });
                } else if (type === 'error') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(90, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.2);
                }
            } catch (e) {
                // Audio bloqueado ou não suportado
            }
        }

        // Inicializar efeitos na carga da página
        window.addEventListener('DOMContentLoaded', () => {
            gerarNuvensBackground();
        });
    </script>
</body>
</html>
