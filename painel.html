<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIEE PLAY - Painel do Orientador</title>
  
  <!-- Fontes Gamer do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  
  <!-- Biblioteca WordCloud2.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>

  <style>
    :root {
      --bg-dark: #12002b;
      --bg-card: #200247;
      --accent-cyan: #00f0ff;
      --accent-yellow: #ffee00;
      --accent-green: #20e070;
      --accent-red: #ff3366;
      --text-light: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 10px;
      font-family: 'VT323', monospace;
      background: linear-gradient(135deg, #090014 0%, #1a0033 50%, #00102e 100%);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--bg-card);
      border: 4px solid var(--accent-cyan);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      padding: 20px;
      border-radius: 8px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed var(--accent-cyan);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .badge {
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      background: var(--accent-yellow);
      color: #000;
      padding: 6px 10px;
      border-radius: 4px;
    }

    h1 {
      font-family: 'Press Start 2P', cursive;
      font-size: 16px;
      color: var(--accent-cyan);
      text-transform: uppercase;
      margin: 0;
      text-shadow: 2px 2px #000;
    }

    .filters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
      background: rgba(0,0,0,0.3);
      padding: 15px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      align-items: flex-end;
    }

    .field-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-family: 'Press Start 2P', cursive;
      font-size: 9px;
      color: var(--accent-yellow);
      margin-bottom: 6px;
    }

    select {
      font-family: 'VT323', monospace;
      font-size: 18px;
      padding: 8px;
      background: #0d001e;
      color: #fff;
      border: 2px solid var(--accent-cyan);
      border-radius: 4px;
      outline: none;
    }

    /* Container de Segurança para Limpeza */
    .reset-container {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: rgba(255, 51, 102, 0.1);
      padding: 8px;
      border: 1px dashed var(--accent-red);
      border-radius: 6px;
      transition: all 0.3s ease;
    }

    .reset-container.unlocked {
      background: rgba(32, 224, 112, 0.15);
      border-color: var(--accent-green);
    }

    .input-pass {
      font-family: 'VT323', monospace;
      font-size: 16px;
      padding: 5px 8px;
      background: #0d001e;
      color: var(--accent-yellow);
      border: 2px solid var(--accent-red);
      border-radius: 4px;
      outline: none;
      text-align: center;
      transition: all 0.3s ease;
    }

    .input-pass:focus {
      box-shadow: 0 0 8px var(--accent-red);
    }

    .reset-container.unlocked .input-pass {
      border-color: var(--accent-green);
      color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    .btn-reset {
      font-family: 'Press Start 2P', cursive;
      font-size: 9px;
      background: #555555;
      color: #888888;
      border: none;
      padding: 10px;
      cursor: not-allowed;
      border-radius: 4px;
      box-shadow: 0 3px #333333;
      transition: all 0.2s ease;
    }

    .btn-reset.active {
      background: var(--accent-red);
      color: white;
      cursor: pointer;
      box-shadow: 0 4px #880022;
    }

    .btn-reset.active:active {
      transform: translateY(2px);
      box-shadow: 0 1px #880022;
    }

    .stats {
      font-family: 'Press Start 2P', cursive;
      font-size: 11px;
      color: var(--accent-green);
      text-align: center;
      margin-bottom: 15px;
    }

    .cloud-box {
      width: 100%;
      height: 450px;
      background: #080015;
      border: 3px solid var(--accent-cyan);
      border-radius: 6px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    @media (max-width: 600px) {
      h1 { font-size: 12px; }
      .cloud-box { height: 350px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <h1>Nuvem de Ideias</h1>
      <span class="badge">CIEE PLAY</span>
    </div>

    <!-- Filtros por Cidade, Turma e Segurança -->
    <div class="filters-grid">
      <div class="field-group">
        <label for="filtroCidade">CIDADE:</label>
        <select id="filtroCidade">
          <option value="TODAS">-- TODAS AS CIDADES --</option>
          <option value="Braço do Norte">Braço do Norte</option>
          <option value="Imbituba">Imbituba</option>
          <option value="Tubarão">Tubarão</option>
        </select>
      </div>

      <div class="field-group">
        <label for="filtroTurma">TURMA:</label>
        <select id="filtroTurma">
          <option value="TODAS">-- TODAS AS TURMAS --</option>
        </select>
      </div>

      <!-- Campo Discreto e Dinâmico de Segurança para Limpeza -->
      <div class="reset-container" id="resetContainer">
        <label for="senhaReset" style="font-size: 8px;">DESBLOQUEAR:</label>
        <input type="password" id="senhaReset" class="input-pass" placeholder="Senha..." autocomplete="off">
        <button id="btnLimpar" class="btn-reset" disabled>🔒 LIMPAR TUDO</button>
      </div>
    </div>

    <div class="stats" id="contadorRespostas">RESPOSTAS RECEBIDAS: 0</div>

    <!-- Tela da Nuvem -->
    <div class="cloud-box">
      <canvas id="canvasNuvem"></canvas>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Configuração do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBPyd0QyTdfmXjWek1wy2rxSYw7xHiT_to",
      authDomain: "ciee-tubarao.firebaseapp.com",
      databaseURL: "https://ciee-tubarao-default-rtdb.firebaseio.com",
      projectId: "ciee-tubarao",
      storageBucket: "ciee-tubarao.firebasestorage.app",
      messagingSenderId: "1031931207865",
      appId: "1:1031931207865:web:8e40f01b03f82d8394fb68",
      measurementId: "G-J8BR6R1P1N"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Mapeamento de Turmas por Cidade
    const turmasPorCidade = {
      "Braço do Norte": ["Terça matutino", "Terça vespertino"],
      "Imbituba": [
        "Segunda vespertino", "Quarta matutino", "Quarta vespertino",
        "Quinta matutino", "Quinta vespertino", "Sexta matutino", "Sexta vespertino"
      ],
      "Tubarão": [
        "Segunda vesp (Sofia)", "Segunda vesp (Fabrício)", "Terça matutino",
        "Terça vesp (Fabrício)", "Terça vesp (João)", "Quarta matutino",
        "Quarta vespertino", "Quinta matutino", "Quinta vespertino",
        "Sexta matutino", "Sexta vespertino"
      ]
    };

    const selectCidade = document.getElementById('filtroCidade');
    const selectTurma = document.getElementById('filtroTurma');
    const contador = document.getElementById('contadorRespostas');
    const btnLimpar = document.getElementById('btnLimpar');
    const senhaReset = document.getElementById('senhaReset');
    const resetContainer = document.getElementById('resetContainer');

    let dadosTotais = {};

    // Validação da senha "malfeitofeito" em tempo real
    senhaReset.addEventListener('input', () => {
      const valor = senhaReset.value.trim().toLowerCase();
      if (valor === 'malfeitofeito') {
        btnLimpar.disabled = false;
        btnLimpar.classList.add('active');
        btnLimpar.innerText = "🔓 LIMPAR TUDO";
        resetContainer.classList.add('unlocked');
      } else {
        btnLimpar.disabled = true;
        btnLimpar.classList.remove('active');
        btnLimpar.innerText = "🔒 LIMPAR TUDO";
        resetContainer.classList.remove('unlocked');
      }
    });

    // Atualiza o select de turmas de acordo com a cidade
    function atualizarSelectTurmas() {
      const cidade = selectCidade.value;
      selectTurma.innerHTML = '<option value="TODAS">-- TODAS AS TURMAS --</option>';

      if (cidade !== 'TODAS' && turmasPorCidade[cidade]) {
        turmasPorCidade[cidade].forEach(t => {
          const opt = document.createElement('option');
          opt.value = t;
          opt.textContent = t;
          selectTurma.appendChild(opt);
        });
      }
      desenharNuvem();
    }

    // Função para desenhar a nuvem
    function desenharNuvem() {
      const cidadeSel = selectCidade.value;
      const turmaSel = selectTurma.value;
      const frequenciaPalavras = {};
      let totalFiltrado = 0;

      Object.values(dadosTotais).forEach(item => {
        const atendeCidade = (cidadeSel === 'TODAS' || item.cidade === cidadeSel);
        const atendeTurma = (turmaSel === 'TODAS' || item.turma === turmaSel);

        if (atendeCidade && atendeTurma && item.palavra) {
          const p = item.palavra.trim().toUpperCase();
          frequenciaPalavras[p] = (frequenciaPalavras[p] || 0) + 1;
          totalFiltrado++;
        }
      });

      contador.innerText = `RESPOSTAS RECEBIDAS: ${totalFiltrado}`;

      const listaNuvem = Object.keys(frequenciaPalavras).map(p => {
        return [p, frequenciaPalavras[p] * 15 + 12];
      });

      const canvas = document.getElementById('canvasNuvem');

      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;

      WordCloud(canvas, {
        list: listaNuvem,
        gridSize: 10,
        weightFactor: 1,
        fontFamily: "'Press Start 2P', cursive",
        color: function() {
          const cores = ['#00f0ff', '#ffee00', '#20e070', '#ff3366', '#ffffff'];
          return cores[Math.floor(Math.random() * cores.length)];
        },
        backgroundColor: '#080015',
        rotateRatio: 0.2
      });
    }

    // Escuta mudanças nos filtros
    selectCidade.addEventListener('change', atualizarSelectTurmas);
    selectTurma.addEventListener('change', desenharNuvem);

    // Escuta atualizações do Firebase
    onValue(ref(db, 'respostas'), (snapshot) => {
      dadosTotais = snapshot.val() || {};
      desenharNuvem();
    });

    // Botão Limpar Tudo
    btnLimpar.addEventListener('click', () => {
      if (!btnLimpar.disabled) {
        if (confirm("ATENÇÃO: Deseja apagar permanentemente todas as respostas registradas no sistema?")) {
          remove(ref(db, 'respostas')).then(() => {
            alert("Registros apagados com sucesso!");
            senhaReset.value = '';
            senhaReset.dispatchEvent(new Event('input'));
          }).catch(err => alert("Erro ao apagar: " + err.message));
        }
      }
    });

    // Redimensiona a nuvem quando a tela muda de tamanho
    window.addEventListener('resize', desenharNuvem);
  </script>
</body>
</html>
